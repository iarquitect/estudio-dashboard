name: ETL + ML Pipeline

on:
  schedule:
    # Lunes 6 AM UTC = 3 AM Argentina
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del retrain"
        required: false
        default: "Retrain manual desde dashboard"

permissions:
  contents: write

concurrency:
  group: etl-ml
  cancel-in-progress: true

jobs:
  etl-ml:
    name: "ETL + Random Forest → dashboard_data.json"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ETL + ML
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/etl_ml.py

      - name: Commit dashboard_data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/dashboard_data.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore(data): update dashboard_data.json [skip ci]"
          git push
